name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Unit and end-to-end tests
        run: go test -race -count=1 -v ./...
      - name: Relay Docker image builds
        run: docker build -t clipferry-relay .
      - name: MCP server Docker image builds
        run: docker build -f mcp.Dockerfile -t clipferry-mcp .
      - name: Standalone MCP server binaries
        run: |
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/bkrdmrcioglu/clipferry/internal/core.Version=${GITHUB_REF_NAME#v}" \
              -o "dist/clipferry-mcp-$os-$arch$ext" ./cmd/clipferry-mcp
          done
      - uses: actions/upload-artifact@v4
        with:
          name: clipferry-mcp
          path: dist/clipferry-mcp-*

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: clipferry-macos
          path: dist/*.dmg

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Install NSIS
        run: command -v makensis || choco install nsis -y --no-progress
      - run: PATH="$PATH:/c/Program Files (x86)/NSIS" ./scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: clipferry-windows
          path: |
            dist/*-setup.exe
            dist/Clipferry-amd64.exe
            dist/Clipferry-arm64.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums for the in-app updater
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "Clipferry ${GITHUB_REF_NAME}" --generate-notes
